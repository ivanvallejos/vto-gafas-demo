<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e0f12" />
    <title>Probador de lentes</title>
    <script type="module" crossorigin src="./assets/index-C6ui_sCa.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DDJg2tHR.css">
  </head>
  <body>
    <main id="stage">
      <video id="video" playsinline muted autoplay></video>
      <canvas id="gl"></canvas>
      <canvas id="landmarks"></canvas>
    </main>

    <header id="topbar">
      <div>
        <div class="brand" id="brand"></div>
        <div class="name" id="pname"></div>
      </div>
      <nav id="picker" aria-label="Elegir lente"></nav>
      <div class="status" id="status"></div>
    </header>

    <section id="start" class="overlay">
      <div class="card">
        <img id="thumb" alt="" />
        <h1>Pruébate el lente</h1>
        <p>Usa la cámara frontal para ver cómo te queda, a tamaño real.</p>
        <button id="startBtn" class="primary">Activar cámara</button>
        <p class="fine">El video se procesa solo en tu dispositivo. No se envía ni se guarda en ningún servidor.</p>
        <p class="error" id="err" hidden></p>
      </div>
    </section>

    <footer id="controls" hidden>
      <button id="tuneBtn" class="ghost" aria-expanded="false">Ajustes</button>
      <button id="shotBtn" class="shutter" aria-label="Capturar foto"></button>
      <button id="dbgBtn" class="ghost" aria-pressed="false">Puntos</button>
    </footer>

    <aside id="tune" hidden>
      <label>Tamaño <output id="oSize"></output>
        <input type="range" id="rSize" min="0.8" max="1.2" step="0.01" value="1" /></label>
      <label>Altura <output id="oY"></output>
        <input type="range" id="rY" min="-12" max="12" step="0.5" value="0" /></label>
      <label>Separación <output id="oZ"></output>
        <input type="range" id="rZ" min="-10" max="20" step="0.5" value="4" /></label>
      <label>Opacidad del cristal <output id="oOp"></output>
        <input type="range" id="rOp" min="0.2" max="1" step="0.01" value="0.88" /></label>
      <label class="check"><input type="checkbox" id="cOcc" /> Mostrar cabeza oculta</label>
      <button id="resetBtn" class="ghost small">Restablecer</button>
    </aside>
  </body>
</html>
